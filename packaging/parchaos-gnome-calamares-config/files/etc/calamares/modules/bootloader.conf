# Fedora's stock calamares package already ships a correct bootloader.conf
# (grub2-install/grub2-mkconfig, EFI paths — verified by reading the
# installed /usr/share/calamares/modules/bootloader.conf directly,
# 2026-09-18). Calamares doesn't merge an /etc/calamares override with the
# packaged default — it's one file or the other — so this is that same
# stock content, based on the packaged default.
#
# CORRECTION (2026-09-23): efiBootloaderId used to be "parchaos-gnome" for
# a branded EFI directory name. Real bug found via a real disk-install
# attempt on actual hardware: with efiBootLoader "sb-shim", Calamares
# doesn't run grub2-install itself -- it expects the shim/grub2-efi-x64
# RPM scriptlets' own EFI files to already exist at their real installed
# location and just runs `grub2-mkconfig -o /boot/efi/EFI/<efiBootloaderId>/
# grub.cfg`. parchaos-install-kernel (this project's replacement for those
# never-run scriptlets, see that script's own comment) only ever populates
# /boot/efi/EFI/fedora/ and /boot/efi/EFI/BOOT/ -- there is no
# /boot/efi/EFI/parchaos-gnome/ directory, so grub2-mkconfig failed
# outright trying to write there ("Installation Failed: Bootloader
# installation error ... returned error code 1"). Worse, even if that
# directory were created, Fedora's shipped grubx64.efi/gcdx64.efi are
# SIGNED images with their GRUB prefix (where they look for grub.cfg)
# baked in at build time to /EFI/fedora/ -- a real, widely-documented
# Fedora quirk -- so they would ignore a grub.cfg placed anywhere else
# regardless of what Calamares generates. Reverted to "fedora" so
# Calamares writes grub.cfg to the same real directory
# parchaos-install-kernel already populates and the same directory the
# signed GRUB binaries actually read from. Ship over fidelity: a working
# boot beats a nicely-branded EFI directory name.
---
efiBootLoader: "sb-shim"
kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"
loaderEntries:
  - "timeout 5"
  - "console-mode keep"
kernelParams: [ "quiet" ]
grubInstall: "grub2-install"
grubMkconfig: "grub2-mkconfig"
grubCfg: "/boot/grub2/grub.cfg"
grubProbe: "grub2-probe"
efiBootMgr: "efibootmgr"
efiBootloaderId: "fedora"
installEFIFallback: true
