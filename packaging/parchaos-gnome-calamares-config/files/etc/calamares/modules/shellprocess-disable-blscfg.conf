# See scripts/parchaos-disable-blscfg for the full story: GRUB's own
# BLS (Boot Loader Specification) dynamic boot-menu discovery
# (blscfg, reading /boot/loader/entries/*.conf at real boot time)
# doesn't work for this profile's named-btrfs-subvolume (@root)
# layout, even with @root set as the filesystem's default subvolume.
# This disables BLS so grub2-mkconfig falls back to its older, static
# menuentry generator instead -- must run after Calamares' own
# `grubcfg` module (which writes /etc/default/grub) and before
# `bootloader` (whose install_secureboot() calls grub2-mkconfig).

i18n:
     name: "Disabling BLS boot entries"

dontChroot: false
timeout: 30
script:
    - command: "/etc/calamares/scripts/parchaos-disable-blscfg"
