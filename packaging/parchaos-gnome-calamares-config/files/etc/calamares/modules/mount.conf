# Fedora's stock calamares package already ships a mount.conf that puts
# /boot in its own separate "@boot" btrfs subvolume (see
# extraMounts/btrfsSubvolumes below, otherwise unchanged from stock).
#
# Real bug found via a real full install + reboot test on actual UEFI
# hardware, reproduced and root-caused in a VM (2026-09-23): the
# install completed with no error, GRUB itself loaded fine (confirmed
# via a working "ParchaOS" NVRAM boot entry -- see
# scripts/parchaos-fix-efi-bootentry), but the GRUB menu it produced
# showed no OS entry at all, only the auto-generated "UEFI Firmware
# Settings" fallback. Root cause: grub2-mkconfig's generated grub.cfg
# uses BLS (blscfg reads /boot/loader/entries/*.conf at boot time) --
# but its `search --fs-uuid --set=root <btrfs-uuid>` finds the raw
# partition and lands at the btrfs TOP LEVEL (subvolid 5) by default,
# which only contains the three sibling `@root`/`@boot`/`@home`
# directories -- confirmed directly by mounting the real installed
# disk both ways: mounting subvol=@root alone shows a completely empty
# /boot (0 bytes, the bare mountpoint directory), while mounting
# subvol=@boot separately shows the real, correctly-written
# vmlinuz/initramfs/loader/entries/*.conf files kernel-install put
# there. GRUB's own filesystem search has no subvolume-aware config
# telling it to descend into the sibling @boot subvolume for BLS
# lookup, so blscfg finds nothing. Fixed the standard, real-world way
# other btrfs-root distros avoid this exact class of problem: /boot is
# NOT given its own separate subvolume at all here (see
# btrfsSubvolumes below) -- it lives as a normal directory inside
# @root instead, so whichever subvolume GRUB's search actually lands
# on for the root filesystem, /boot/loader/entries is really there
# nested inside it, not hidden in a sibling.
#
# Everything below this point is otherwise Fedora's unmodified stock
# content (Calamares doesn't merge a local override with the packaged
# default -- it's one file or the other -- so it all needs to be
# repeated here, not just the one setting that changed).
---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true

btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@root
    - mountPoint: /home
      subvolume: /@home

btrfsSwapSubvol: /@swap

mountOptions:
    - filesystem: default
      options: [ defaults ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    - filesystem: btrfs
      options: [ defaults, compress=zstd:1 ]
    - filesystem: btrfs_swap
      options: [ defaults ]
