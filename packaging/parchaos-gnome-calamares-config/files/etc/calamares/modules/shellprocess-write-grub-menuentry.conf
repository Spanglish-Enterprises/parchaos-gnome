# See scripts/parchaos-write-grub-menuentry for the full story: even
# with @root set as the filesystem's default btrfs subvolume, GRUB's
# own blscfg-based dynamic boot menu still didn't find a real OS
# entry. This bypasses blscfg's dynamic discovery by writing a real,
# static grub menuentry (built from the same already-correct BLS entry
# kernel-install wrote) into custom.cfg, which grub.cfg already
# sources unconditionally.

i18n:
     name: "Writing GRUB menu entry"

dontChroot: false
timeout: 30
script:
    - command: "/etc/calamares/scripts/parchaos-write-grub-menuentry"
