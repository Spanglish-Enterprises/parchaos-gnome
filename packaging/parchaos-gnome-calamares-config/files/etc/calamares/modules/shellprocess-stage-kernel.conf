# See scripts/parchaos-stage-kernel for the full story: Calamares'
# unpackfs module reuses its generic pseudo-filesystem rsync excludes
# (/proc, /sys, /dev, /run, /run/udev) for "file" sourcefs entries
# too -- the live kernel's real path, /run/initramfs/live/boot/vmlinuz,
# itself lives under /run/ on this dracut-live image, so it was being
# silently self-excluded (rsync exit 23, 0 bytes transferred). This
# stages the kernel to /tmp first, outside any excluded path, before
# unpackfs.conf's second entry copies it from there instead.

i18n:
     name: "Staging kernel for install"

dontChroot: true
timeout: 60
script:
    - command: "/etc/calamares/scripts/parchaos-stage-kernel"
