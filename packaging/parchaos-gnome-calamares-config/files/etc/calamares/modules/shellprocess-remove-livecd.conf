# Rewritten for Fedora — see scripts/parchaos-finalize-install for what
# changed and why (upstream's alg-finalisation script isn't part of the
# pear-calamares-config repo and appears to be Arch/pacman-specific).

i18n:
     name: "Finalizing your installation"

dontChroot: false
timeout: 1000
script:
    - command: "/etc/calamares/scripts/parchaos-finalize-install"
