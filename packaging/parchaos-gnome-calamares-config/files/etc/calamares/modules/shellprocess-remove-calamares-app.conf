# See scripts/parchaos-remove-calamares-app for the full story: this
# MUST run as the very last shellprocess step in settings.conf's exec
# sequence, after every other script that lives in this same package
# (parchaos-gnome-calamares-config) has already executed -- removing
# the "calamares" package cascade-removes this one too (Requires:
# calamares in the spec), which wipes /etc/calamares/scripts/ and
# breaks any later step that still needs a script from it.

i18n:
     name: "Removing the installer"

dontChroot: false
timeout: 30
script:
    - command: "/etc/calamares/scripts/parchaos-remove-calamares-app"
