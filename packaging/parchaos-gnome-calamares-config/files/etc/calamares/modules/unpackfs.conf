# Ported from pearOS-archlinux/pear-calamares-config for Fedora.
#
# Upstream's source path is Arch-specific (archiso's own runtime mount
# layout: /run/archiso/bootmnt/arch/x86_64/airootfs.sfs) and unpacks the
# kernel as a second, separate source entry because archiso's airootfs.sfs
# doesn't include a kernel inside it.
#
# This engine's live image differs from archiso in path, but the
# underlying "kernel isn't inside the squashfs" problem turned out to be
# the same. The ISO is built with a Fedora dracut-live layout
# (engine/build-iso.sh puts the squashfs at LiveOS/squashfs.img), and
# dracut-live mounts the whole ISO9660 filesystem at /run/initramfs/live
# at boot — so the real, live-verified source path for the rootfs is
# /run/initramfs/live/LiveOS/squashfs.img.
#
# CORRECTION (2026-09-20): the comment that used to be here claimed this
# squashfs's own /boot already contains the real kernel + initramfs.
# That was wrong — found via a real end-to-end install+reboot test
# (see docs/phase4-findings.md) that the installed system had no
# vmlinuz/initramfs/BLS entry at all, so GRUB dropped to a rescue shell
# with no OS to boot. Mounting a real built ISO directly confirmed it:
# vmlinuz and initramfs.img live at the ISO's own top level
# (/boot/vmlinuz, /boot/initramfs.img — i.e.
# /run/initramfs/live/boot/... at runtime), entirely outside the
# squashfs, same as archiso's airootfs.sfs. The second entry below
# copies the live kernel to a neutral staging name (its real
# vmlinuz-<kver> name can't be known until shellprocess@install-kernel
# runs in the chroot and queries the installed kernel-core version).
unpack:
    -   source: "/run/initramfs/live/LiveOS/squashfs.img"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/run/initramfs/live/boot/vmlinuz"
        sourcefs: "file"
        destination: "/boot/vmlinuz.livecopy"
