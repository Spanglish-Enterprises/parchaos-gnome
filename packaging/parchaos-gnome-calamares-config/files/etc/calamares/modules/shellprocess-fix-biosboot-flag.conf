# See scripts/parchaos-fix-biosboot-flag for the full story: works around
# a real KPMCore bug where partition.conf's `type:` GUID for the BIOS
# Boot Partition isn't actually applied to the created partition.

i18n:
     name: "Preparing boot partition"

dontChroot: true
timeout: 60
script:
    - command: "/etc/calamares/scripts/parchaos-fix-biosboot-flag ${ROOT}"
