# See scripts/parchaos-install-kernel for the full story: unpackfs's
# squashfs source never contained a bootable kernel at all (this
# engine's live ISO keeps vmlinuz/initramfs at the ISO's own top level,
# outside the squashfs) -- this step registers the kernel copied in by
# unpackfs.conf's second entry via `kernel-install add`, exactly like a
# real `dnf install kernel-core` transaction would, so grub2-mkconfig
# has an actual OS entry to generate later.

i18n:
     name: "Installing kernel"

dontChroot: false
timeout: 120
script:
    - command: "/etc/calamares/scripts/parchaos-install-kernel"
