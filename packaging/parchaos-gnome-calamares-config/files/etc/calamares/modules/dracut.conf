# Rebuilds the initramfs of every installed kernel inside the new system.
#
# Fedora's calamares package ships upstream's example dracut.conf, which
# sets initramfsName: /boot/initramfs-freebsd.img. With that, the installer
# wrote a stray /boot/initramfs-freebsd.img and never rebuilt the real
# initramfs, so installed systems booted the live ISO's initramfs (without
# the Plymouth theme set just before this step, and without any dracut
# settings ParchaOS packages add). Found on a real install in a VM,
# 2026-11-15. No initramfsName here: dracut picks the standard path per
# kernel.
---
options: [ "-f", "--regenerate-all" ]
