#
# ParchaOS override of Calamares' stock users.conf. Everything below is
# the real shipped default (from calamares-3.3.14's own
# /usr/share/calamares/modules/users.conf, fetched directly, not
# guessed) with exactly one change: `input` added to defaultGroups.
#
# Real bug found 2026-09-24 on real hardware: parchaos-macos-remap
# (xremap, generic evdev-grab build, not the GNOME-portal-based
# xremap-gnome-bin Pulsar OS itself depends on) needs read+grab access
# to /dev/input/event* to do its keyboard remapping. Those nodes are
# root:input 0660, and Fedora's own uaccess udev rules deliberately do
# NOT dynamically grant keyboard/mouse event nodes to the active
# session user (unlike joysticks) -- a real, intentional security
# boundary against arbitrary local snooping, not an oversight. Without
# `input` in defaultGroups, every fresh install's user account is
# created without it, so parchaos-macos-remap.service crash-loops
# forever ("No input devices... Failed to prepare input devices: No
# device was selected!") since it can never open any device node.
# Caught live on the real machine: restart counter was already at 2353
# by the time this was found. Calamares creates the account (and its
# groups) at install time, before any package's own %post could ever
# know the eventual username -- same "which user, what session" gap
# already documented for the systemd user-preset and dconf-default
# mechanisms elsewhere in this project -- so this is the one correct
# place to grant it, not a udev rule (which would have to weaken the
# uaccess boundary for every local user, not just the one real account
# Calamares creates) and not a package %post (wrong lifecycle stage).
#
# See below for Calamares' own documentation of this file's schema.

### GROUPS CONFIGURATION
#
# The system has groups of uses. Some special groups must be
# created during installation. Optionally, there are special
# groups for users who can use sudo and for supporting autologin.

# Used as default groups for the created user.
# Adjust to your Distribution defaults.
#
# Each entry in the *defaultGroups* list is either:
#   - a string, naming a group; this is a **non**-system group
#     which does not need to exist in the target system; if it
#     does not exist, it will be created.
#   - an entry with subkeys *name*, *must_exist* and *system*;
#     if the group *must_exist* and does not, an error is thrown
#     and the installation fails.
#
#     The group is created if it does not exist, and it is
#     created as a system group (GID < 1000) or user group
#     (GID >= 1000) depending on the value of *system*.
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - name: wheel
      must_exist: false
      system: true
    - name: input
      must_exist: true
      system: true

#sudoersGroup:    wheel
#autologinGroup:  autologin


### ROOT AND SUDO
sudoersConfigureWithGroup: false
setRootPassword: true
doReusePassword: false


### PASSWORDS AND LOGIN
doAutologin:     false

passwordRequirements:
    minLength: 6  # Password at least this many characters
    libpwquality:
        - minlen=6
        - minclass=0

allowWeakPasswords: false
allowWeakPasswordsDefault: false


# User settings
user:
  shell: ""
  forbidden_names: [ root ]
  home_permissions: "o700"


# Hostname settings
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "${login}-${product}"
  forbidden_names: [ localhost ]

allowActiveDirectory: false

presets:
    fullName:
        editable: true
    loginName:
        editable: true
