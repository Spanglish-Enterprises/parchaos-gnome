# See scripts/parchaos-set-default-subvol for the full story: GRUB's
# generated grub.cfg does a raw btrfs search with no subvol= option,
# landing at the filesystem's neutral top level -- where @root's real
# content (including /boot/loader/entries, needed for the BLS-based
# boot menu) is invisible unless @root is the filesystem's DEFAULT
# subvolume. This sets it as such.

i18n:
     name: "Setting default btrfs subvolume"

dontChroot: false
timeout: 30
script:
    - command: "/etc/calamares/scripts/parchaos-set-default-subvol"
