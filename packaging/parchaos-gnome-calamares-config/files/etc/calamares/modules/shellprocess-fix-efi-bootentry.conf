# See scripts/parchaos-fix-efi-bootentry for the full story: Calamares'
# own stock bootloader module passes a full Linux mountpoint path
# (/boot/efi/EFI/fedora/shimx64.efi) to `efibootmgr -l`, which needs a
# path relative to the ESP itself instead -- producing a registered but
# broken NVRAM boot entry ("no bootable device" on real hardware after
# an apparently-successful install). This runs right after the stock
# `bootloader` module and adds a second, correct entry ahead of it in
# BootOrder.

i18n:
     name: "Fixing UEFI boot entry"

dontChroot: false
timeout: 30
script:
    - command: "/etc/calamares/scripts/parchaos-fix-efi-bootentry"
