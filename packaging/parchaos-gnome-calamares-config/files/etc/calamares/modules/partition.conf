#
# Fedora's stock calamares package already ships a partition.conf with
# sane defaults for the common cases (UEFI+GPT gets its ESP
# auto-prepended; BIOS+MSDOS-MBR needs nothing special) — but NOT for
# BIOS+GPT with a btrfs root, which is what this profile actually
# produces (`defaultPartitionTableType: gpt` below is Fedora's own
# stock value, unconditional regardless of firmware). FOUND via a real
# end-to-end install attempt (2026-09-19/20, docs/phase4-findings.md):
# `grub2-install --target=i386-pc` failed with "this GPT partition
# label contains no BIOS Boot Partition; embedding won't be possible"
# followed by "filesystem `btrfs` doesn't support blocklists" — grub's
# fallback embedding method (writing a raw block list into the boot
# sector) is refused by btrfs because its COW/balance semantics can
# move blocks after the fact, so without a real BIOS Boot Partition,
# BIOS+GPT+btrfs can never produce a bootable system. Anaconda handles
# this automatically; Calamares' stock config here does not. Fixed
# below with an explicit `partitionLayout` that prepends a small
# unformatted BIOS Boot Partition (the standard GPT type GUID for this,
# also what `parted`/`grub2-install` themselves look for) ahead of
# root. Calamares still auto-prepends the EFI System Partition on top
# of a custom layout when booting via UEFI (per this file's own
# documentation below) — the extra BIOS boot partition is harmless
# there, and is exactly what real distros ship unconditionally on GPT
# to support both firmware types from one image.
#
# Everything below this point is otherwise Fedora's unmodified stock
# content (Calamares doesn't merge a local override with the packaged
# default — it's one file or the other — so it all needs to be
# repeated here, not just the one setting that changed).

# Options for EFI system partition.
#
# - *mountPoint*
#   This setting specifies the mount point of the EFI system partition. Some
#   distributions (Fedora, Debian, Manjaro, etc.) use /boot/efi, others (KaOS,
#   etc.) use just /boot.
#
#   Defaults to "/boot/efi", may be empty (but weird effects ensue)
# - *recommendedSize*
#   This optional setting specifies the size of the EFI system partition.
#   If nothing is specified, the default size of 300MiB will be used.
#   When writing quantities here, M is treated as MiB, and if you really
#   want one-million (10^6) bytes, use MB.
# - *minimumSize*
#   This optional setting specifies the absolute minimum size of the EFI
#   system partition. If nothing is specified, the *recommendedSize*
#   is used instead.
# - *label*
#   This optional setting specifies the name of the EFI system partition (see
#   PARTLABEL; gpt only; requires KPMCore >= 4.2.0).
#   If nothing is specified, the partition name is left unset.
#
# Going below the *recommended* size is allowed, but the user will
# get a warning that it might not work. Going below the *minimum*
# size is not allowed and the user will be told it will not work.
#
# Both quantities must be at least 32MiB, this is enforced by the EFI
# spec. If minimum is not specified, it defaults to the recommended
# size. Distro's that allow more user latitude can set the minimum lower.
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    300MiB
    minimumSize:        32MiB
    label:              "EFI"

# In autogenerated partitioning, allow the user to select a swap size?
# If there is exactly one choice, no UI is presented, and the user
# cannot make a choice -- this setting is used. If there is more than
# one choice, a UI is presented.
userSwapChoices:
    - none      # Create no swap, use no swap
    - small     # Up to 4GB
    - suspend   # At least main memory size
    - file      # To swap file instead of partition

# This setting specifies the LUKS generation (i.e LUKS1, LUKS2) used internally by
# cryptsetup when creating an encrypted partition.
#
# The default is luks1
luksGeneration: luks1

# Correctly draw nested (e.g. logical) partitions as such.
drawNestedPartitions:   true

# Show/hide partition labels on manual partitioning page.
alwaysShowPartitionLabels: true

# Initial selection on the Choice page
initialPartitioningChoice: none
initialSwapChoice: none

# Default partition table type, used when a "erase" disk is made.
#
# Possible values: gpt, msdos (or other names defined by KPMcore).
# If nothing is specified, Calamares defaults to "gpt" if system is
# efi or "msdos" otherwise.
defaultPartitionTableType: gpt

# Default filesystem type, used when a "new" partition is made.
defaultFileSystemType:  "btrfs"

# The ClearMounts job unmounts / unmaps things before partitioning.
essentialMounts: [ "live-*", "control", "ventoy" ]

# LVM support
lvm:
    enable: true

# Partition layout.
#
# See the upstream module's own documentation
# (/usr/share/calamares/modules/partition.conf) for the full field
# reference — this is the same schema, just with an explicit layout
# instead of relying on the single-root-partition default.
partitionLayout:
    - name: "biosboot"
      type: "21686148-6449-6E6F-744E-656564454649"
      size: 1MiB
    - name: "root"
      filesystem: "btrfs"
      mountPoint: "/"
      size: 100%
