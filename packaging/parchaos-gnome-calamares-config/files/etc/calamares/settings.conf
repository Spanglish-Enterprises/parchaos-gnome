# ParchaOS (GNOME) Calamares settings, ported from the KDE (pearos)
# variant's own pearos-calamares-config -- same DE-agnostic install
# sequence, partition/kernel/EFI fixes, all found via that variant's
# own real end-to-end install+reboot tests. See the packaging spec's
# banner comment for the full list of what changed and why.
#
# Configuration file for Calamares
# Syntax is YAML 1.2
---

modules-search: [ local ]

instances:
- id:       remove-livecd
  module:   shellprocess
  config:   shellprocess-remove-livecd.conf
- id:       fix-biosboot-flag
  module:   shellprocess
  config:   shellprocess-fix-biosboot-flag.conf
- id:       install-kernel
  module:   shellprocess
  config:   shellprocess-install-kernel.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - users
  - partition
  - summary
- exec:
  - partition
  - shellprocess@fix-biosboot-flag
  - mount
  - unpackfs
  # unpackfs's squashfs source has no kernel at all (see
  # unpackfs.conf) -- this registers the kernel file it copies in
  # separately via kernel-install, so later steps (dracut, grubcfg)
  # have a real kernel + BLS entry to work with.
  - shellprocess@install-kernel
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - luksopenswaphookcfg
  # Runs before dracut so the pearOS Plymouth theme it sets as default
  # actually gets baked into the regenerated initramfs, not skipped.
  - shellprocess@remove-livecd
  - dracut
  - users
  - removeuser
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - packages
  - grubcfg
  - bootloader
  - umount
- show:
  - finished


branding: ParchaOS
prompt-install: false

dont-chroot: false

disable-cancel: false

disable-cancel-during-exec: false

hide-back-and-next-during-exec: true

quit-at-end: false
