# ParchaOS (GNOME) Calamares settings, ported from the KDE (pearos)
# variant's own pearos-calamares-config -- same DE-agnostic install
# sequence, partition/kernel/EFI fixes, all found via that variant's
# own real end-to-end install+reboot tests. See the packaging spec's
# banner comment for the full list of what changed and why.
#
# Configuration file for Calamares
# Syntax is YAML 1.2
---

modules-search: [ local ]

instances:
- id:       remove-livecd
  module:   shellprocess
  config:   shellprocess-remove-livecd.conf
- id:       fix-biosboot-flag
  module:   shellprocess
  config:   shellprocess-fix-biosboot-flag.conf
- id:       stage-kernel
  module:   shellprocess
  config:   shellprocess-stage-kernel.conf
- id:       set-default-subvol
  module:   shellprocess
  config:   shellprocess-set-default-subvol.conf
- id:       install-kernel
  module:   shellprocess
  config:   shellprocess-install-kernel.conf
- id:       fix-efi-bootentry
  module:   shellprocess
  config:   shellprocess-fix-efi-bootentry.conf
- id:       write-grub-menuentry
  module:   shellprocess
  config:   shellprocess-write-grub-menuentry.conf
- id:       disable-blscfg
  module:   shellprocess
  config:   shellprocess-disable-blscfg.conf
- id:       remove-calamares-app
  module:   shellprocess
  config:   shellprocess-remove-calamares-app.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - users
  - partition
  - summary
- exec:
  - partition
  - shellprocess@fix-biosboot-flag
  # Real bug found via a real disk-install attempt on actual hardware
  # (2026-09-23): Calamares' unpackfs module reuses the SAME generic
  # rsync exclude list (--exclude /proc/ /sys/ /dev/ /run/ /run/udev/
  # -- meant for skipping pseudo-filesystems when copying a full
  # mounted rootfs) for "file" sourcefs entries too, not just
  # directory/squashfs ones. unpackfs.conf's second entry's real
  # source, /run/initramfs/live/boot/vmlinuz, itself lives under
  # /run/ on this dracut-live image -- so `--exclude /run/` silently
  # excludes the ENTIRE source file. Confirmed directly: reproducing
  # Calamares' own logged rsync invocation by hand gives exit 23
  # ("some files/attrs were not transferred") with "total size is 0"
  # -- the file was never even queued for transfer, let alone copied.
  # This is why every previous VM test (via a virtual CD-ROM) looked
  # fine when just checking the source file's *existence* -- the bug
  # is in Calamares' own copy step, not the source, and only surfaces
  # once unpackfs actually runs. Fixed by staging the live kernel to
  # /tmp (not under any excluded path) in its own step BEFORE
  # unpackfs runs, and pointing unpackfs.conf's second entry at that
  # staged copy instead of the original /run/initramfs/live path.
  - shellprocess@stage-kernel
  - mount
  - unpackfs
  # unpackfs's squashfs source has no kernel at all (see
  # unpackfs.conf) -- this registers the kernel file it copies in
  # separately via kernel-install, so later steps (dracut, grubcfg)
  # have a real kernel + BLS entry to work with.
  - shellprocess@install-kernel
  # Real bug found via a real full install + reboot test on actual
  # UEFI hardware (2026-09-23): GRUB's generated grub.cfg does a raw
  # btrfs search with no subvol= option, landing at the filesystem's
  # neutral top level where @root's real content (including
  # /boot/loader/entries, needed for the BLS-based boot menu) is
  # invisible -- confirmed directly by mounting the raw partition both
  # before and after setting @root as the filesystem's default
  # subvolume. See scripts/parchaos-set-default-subvol for the full
  # root-cause writeup. Runs chrooted (like install-kernel above), so
  # it must come after unpackfs actually populates the target with a
  # real rootfs (a real /bin/sh to chroot into) -- placing it directly
  # after `mount`, before unpackfs, made the target still-empty at
  # that point and chroot itself failed outright ("No such file or
  # directory").
  - shellprocess@set-default-subvol
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - luksopenswaphookcfg
  # Runs before dracut so the pearOS Plymouth theme it sets as default
  # actually gets baked into the regenerated initramfs, not skipped.
  - shellprocess@remove-livecd
  - dracut
  - users
  - removeuser
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - packages
  - grubcfg
  # Real bug found via repeated real full install + reboot tests on
  # actual UEFI hardware (2026-09-23): even with @root set as the
  # filesystem's default btrfs subvolume, GRUB's own blscfg-based
  # dynamic boot-menu discovery still produced no real OS entry. See
  # scripts/parchaos-disable-blscfg for the full root-cause writeup.
  # Must run after grubcfg (which writes /etc/default/grub) and before
  # bootloader (whose install_secureboot() calls grub2-mkconfig).
  - shellprocess@disable-blscfg
  - bootloader
  # Real bug found via a real UEFI install on actual hardware
  # (2026-09-23): the install completed with no error, but the
  # firmware reported "no bootable device" on reboot. Root-caused by
  # running Calamares' own bootloader module logic by hand: its
  # install_secureboot() passes a full Linux mountpoint path
  # (/boot/efi/EFI/fedora/shimx64.efi) to `efibootmgr -l`, which needs
  # a path relative to the ESP itself -- efibootmgr does not strip the
  # mountpoint prefix, so the resulting NVRAM entry's UEFI device path
  # literally embeds "\boot\efi\..." and points at a file that does
  # not exist on the actual ESP filesystem. See
  # scripts/parchaos-fix-efi-bootentry for the full root-cause writeup
  # and the confirmed-correct replacement command.
  - shellprocess@fix-efi-bootentry
  # Real bug found via repeated real full install + reboot tests on
  # actual UEFI hardware (2026-09-23): even with @root set as the
  # filesystem's default btrfs subvolume (the previous fix), GRUB's
  # own blscfg-based dynamic boot menu still found no real OS entry --
  # only the auto-generated "UEFI Firmware Settings" fallback. See
  # scripts/parchaos-write-grub-menuentry for the full root-cause
  # writeup: this bypasses blscfg's dynamic discovery entirely by
  # writing a real, static grub menuentry into custom.cfg (which
  # grub.cfg already sources unconditionally), built from the same
  # already-correct BLS entry kernel-install wrote.
  - shellprocess@write-grub-menuentry
  # Must be the LAST shellprocess step, after every other script in
  # this same package has already run -- see
  # scripts/parchaos-remove-calamares-app for why.
  - shellprocess@remove-calamares-app
  - umount
- show:
  - finished


branding: ParchaOS
prompt-install: false

dont-chroot: false

disable-cancel: false

disable-cancel-during-exec: false

hide-back-and-next-during-exec: true

quit-at-end: false
