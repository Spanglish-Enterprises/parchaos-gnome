# Runs as root, once per login, before that user's own session starts --
# gives that one real user's GNOME session access to its own xremap
# socket directory (see parchaos-keyboard-remap-socket-dir), so per-app
# remaps (Terminal, Parcher) keep working. The `-` means a failure here
# (e.g. the package isn't installed) never blocks login.
[Service]
ExecStartPre=-/usr/libexec/parchaos-keyboard-remap-socket-dir %i
