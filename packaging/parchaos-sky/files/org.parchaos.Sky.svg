<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Parcha Sky: original icon for ParchaOS. A dusk sky with a warm sun behind a soft cloud. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a5fb8"/>
      <stop offset="0.62" stop-color="#7f8fd6"/>
      <stop offset="1" stop-color="#f4a36c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.7" stop-color="#ffc85a"/>
      <stop offset="1" stop-color="#ffb347"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e8f5"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#sky)"/>
  <circle cx="78" cy="50" r="22" fill="url(#sun)"/>
  <path d="M30 92c-9 0-15-6-15-14 0-8 6-14 14-14 2-11 11-19 23-19 10 0 18 6 21 15 2-1 4-1 6-1 10 0 17 7 17 16s-7 17-17 17z" fill="url(#cloud)"/>
  <rect x="8" y="8" width="112" height="112" rx="30" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
</svg>
