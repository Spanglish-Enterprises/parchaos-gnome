<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- ParchaOS fruit for the menu bar, drawn on the 16 px grid: a round
       body with a stem and one bold leaf, each far enough apart to stay
       readable at menu-bar size. -->
  <circle fill="#bebebe" cx="8" cy="9" r="5.5"/>
  <rect fill="#bebebe" x="7" y="0.5" width="1.6" height="3.4" rx="0.8"/>
  <ellipse fill="#bebebe" cx="11.4" cy="1.9" rx="2.5" ry="1.25" transform="rotate(-25 11.4 1.9)"/>
</svg>
