  <rect fill="#bebebe" x="7" y="1" width="2" height="4"/>
  <path fill="#bebebe" d="M9 4.6C9 1.6 11.5 0 15 0.4C14.9 3.6 12.6 5.2 9 4.6Z"/>
</svg>
