# ==============================================================================
# parchaos profile metadata (Fedora base, GNOME desktop)
# Sourced by engine/build-iso.sh — plain KEY=VALUE, no logic here.
#
# The ParchaOS desktop, ported from Pulsar OS's GNOME ecosystem
# (https://bittenfruit.inled.es/, https://github.com/Inled-Pulsar-OS/PKG).
# ==============================================================================

PROFILE_DISPLAY_NAME="ParchaOS"

# Short identifier for the profile.
PROFILE_SLUG="parchaos"

# ISO9660 volume label.
PROFILE_ISO_LABEL="PARCHAOS"

# Output filename prefix: $PROFILE_ISO_PREFIX-$BRANCH-$VERSION-<arch>.iso (x86_64 or aarch64)
PROFILE_ISO_PREFIX="parchaos-gnome"

# GNOME Shell is Wayland-native by default on Fedora; GNOME on Xorg is
# kept installed as a fallback session (see packages.list) but not
# defaulted to.
PROFILE_SESSION="wayland"

# Which livesys-scripts session hook to activate (see
# engine/build-iso.sh's PROFILE_LIVESYS_SESSION usage) — livesys-scripts
# ships sessions.d/livesys-gnome out of the box, confirmed via a real
# `rpm -ql livesys-scripts` check the same way the KDE profile's own
# "kde" value was confirmed.
PROFILE_LIVESYS_SESSION="gnome"

# GDM (not SDDM) is Fedora's own GNOME display manager; resolves
# automatically once installed since no competing DM is in
# packages.list. No PROFILE_SDDM_THEME equivalent exists yet for GNOME
# — a GDM theme is a real future branding task (Pulsar OS doesn't ship
# a from-scratch GDM theme; check whether it even changes GDM's own
# look or just wires GNOME Shell theming through).

# No Plasma-specific look-and-feel/Kvantum/GTK-theme-name settings here
# — those were KDE-only concepts. GNOME theming (once ported) will be a
# real GTK4/libadwaita theme + GNOME Shell theme, wired in
# packages.sh/customize.sh directly rather than through profile.conf
# name lookups the way KDE's Kvantum/icon-theme names worked.
