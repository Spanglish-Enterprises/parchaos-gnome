# ==============================================================================
# UNTESTED skeleton — mirrors the structure pearOS-archlinux/iso's
# gh-actions/ setup is described as having (build on push/schedule, publish
# ISO + checksum), rewritten for this repo's Fedora engine.
#
# Known gap, not yet solved: engine/build-iso.sh needs real root privileges
# for dnf --installroot and systemd-nspawn, and GitHub-hosted runners don't
# grant the loop-device/user-namespace access livemedia-style ISO builds
# usually need without extra setup (nested containers, --privileged, or a
# self-hosted runner). This workflow runs the build step as a placeholder;
# expect it to need a privileged self-hosted runner or a
# fedora:latest container with --privileged before it actually produces an
# ISO. Flagged rather than guessed at, per the same "don't assert what
# wasn't verified" rule as the rest of this repo's Phase 0/2 work.
# ==============================================================================

name: Build ISO

on:
  workflow_dispatch:
    inputs:
      # Real bug found 2026-09-24 (see the project's development notes): this
      # used to default to "pearos", silently building the wrong product
      # for any manual run that forgot to set it. Required now, matching
      # engine/build-iso.sh's own --profile no-longer-has-a-default fix.
      profile:
        description: "Profile to build (profiles/parchaos)"
        required: true
      branch:
        description: "Fedora release (a number, or 'rawhide')"
        default: "44"
        required: false
  schedule:
    # Scheduled runs get no inputs, so they build the GNOME (parchaos)
    # profile, which is the product this repository ships.
    - cron: "0 6 * * 0"   # weekly, Sundays 06:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
      options: --privileged
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          dnf -y install dnf-plugins-core rsync squashfs-tools xorriso \
              grub2-tools grub2-pc-modules grub2-efi-x64-modules dosfstools mtools systemd-container git

      - name: Build ISO
        run: |
          ./engine/build-iso.sh \
            --profile "${{ github.event.inputs.profile || 'parchaos' }}" \
            --branch "${{ github.event.inputs.branch || '44' }}" \
            --clean-target

      - name: Check the UEFI boot image uses the signed shim
        run: |
          iso=$(ls build/*.iso | head -1)
          xorriso -osirrox on -indev "$iso" -extract /EFI/efiboot.img /tmp/efiboot.img
          mcopy -i /tmp/efiboot.img ::/EFI/BOOT/BOOTX64.EFI /tmp/BOOTX64.EFI
          mcopy -i /tmp/efiboot.img ::/EFI/BOOT/grubx64.efi /tmp/grubx64.efi
          # Fedora's shim is signed by Microsoft's UEFI CA; GRUB by Fedora.
          grep -aq "Microsoft Corporation UEFI CA" /tmp/BOOTX64.EFI
          grep -aq "Fedora" /tmp/grubx64.efi
          echo "UEFI boot image: signed shim -> Fedora GRUB"

      - name: Upload ISO, checksum and package list
        uses: actions/upload-artifact@v4
        with:
          name: parchaos-iso
          path: |
            build/*.iso
            build/*.iso.sha256
            build/*.iso.packages.tsv
          retention-days: 14
