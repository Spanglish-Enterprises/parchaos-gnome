name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"   # weekly, so fork-versions notices Fedora updates

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: dnf -y install ShellCheck rpm-build glib2 desktop-file-utils python3 nodejs
      - name: Run checks
        run: scripts/lint.sh

  # Starts a headless GNOME Shell with the ParchaOS extensions straight
  # from the repository and drives them (scripts/smoke-test.sh).
  smoke:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v5
      - name: Install GNOME Shell
        run: dnf -y install gnome-shell mesa-dri-drivers dbus-daemon glib2 python3 python3-dbusmock gnome-weather
      - name: Start a system D-Bus (GNOME Shell needs one)
        run: |
          mkdir -p /run/dbus
          dbus-daemon --system --fork
          # Stand-in logind, as GNOME Shell's own CI does.
          python3 -m dbusmock --system --template logind &
          sleep 2
      - name: Run the smoke test
        run: scripts/smoke-test.sh

  # ParchaOS ships patched builds of some Fedora packages. The ParchaOS
  # repository has higher dnf priority, so a newer Fedora build does NOT
  # replace them: users would silently miss Fedora's fixes until the fork
  # is rebased. Fail when Fedora has a newer version than the fork.
  fork-versions:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: dnf -y install rpm-build python3-rpm
      - name: Compare forks with Fedora (version and release)
        run: scripts/check-forks.py
