name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"   # weekly, so fork-versions notices Fedora updates

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: dnf -y install ShellCheck rpm-build glib2 desktop-file-utils python3 nodejs
      - name: Run checks
        run: scripts/lint.sh

  # Starts a headless GNOME Shell with the ParchaOS extensions straight
  # from the repository and drives them (scripts/smoke-test.sh).
  smoke:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v5
      - name: Install GNOME Shell
        run: dnf -y install gnome-shell mesa-dri-drivers dbus-daemon glib2 python3 python3-dbusmock gnome-weather
      - name: Start a system D-Bus (GNOME Shell needs one)
        run: |
          mkdir -p /run/dbus
          dbus-daemon --system --fork
          # Stand-in logind, as GNOME Shell's own CI does.
          python3 -m dbusmock --system --template logind &
          sleep 2
      - name: Run the smoke test
        run: scripts/smoke-test.sh

  # ParchaOS ships patched builds of some Fedora packages. The ParchaOS
  # repository has higher dnf priority, so a newer Fedora build does NOT
  # replace them: users would silently miss Fedora's fixes until the fork
  # is rebased. Fail when Fedora has a newer version than the fork.
  fork-versions:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: dnf -y install rpm-build
      - name: Compare forks with Fedora
        run: |
          status=0
          for pkg in gnome-control-center; do
            ours=$(rpmspec -q --srpm --qf '%{version}' packaging/$pkg/$pkg.spec 2>/dev/null)
            fedora=$(dnf -q repoquery --latest-limit 1 --qf '%{version}' "$pkg" | tail -1)
            echo "$pkg: ParchaOS $ours, Fedora $fedora"
            if [ "$(printf '%s\n%s\n' "$ours" "$fedora" | sort -V | tail -1)" != "$ours" ]; then
              echo "::error::$pkg: Fedora has $fedora, the ParchaOS fork is $ours. Rebase the fork."
              status=1
            fi
          done
          # Parcher is based on an older Nautilus on purpose until its
          # rebase (docs/parcher-rebase-plan.md): warn, don't fail.
          base=$(rpmspec -q --srpm --qf '%{version}' packaging/parcher/parcher.spec 2>/dev/null)
          fedora=$(dnf -q repoquery --latest-limit 1 --qf '%{version}' nautilus | tail -1)
          echo "parcher: Nautilus $base base, Fedora nautilus $fedora"
          if [ "$(printf '%s\n%s\n' "$base" "$fedora" | sort -V | tail -1)" != "$base" ]; then
            echo "::warning::Parcher is based on Nautilus $base; Fedora has $fedora. See docs/parcher-rebase-plan.md."
          fi
          exit $status
